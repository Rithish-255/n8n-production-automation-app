version: "3.9"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=UTC
      - N8N_ENCRYPTION_KEY=change_this_key
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - app
    networks:
      - app-network

  app:
    image: node:20-bullseye
    container_name: automation-app
    working_dir: /app
    volumes:
      - ./app:/app
      - ./notes:/notes
    command: >
      sh -c "npm install express dotenv openai twilio googleapis playwright &&
             node server.js"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NOTES_PATH=/notes/notes.txt
      - BROWSER_HEADLESS=true
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
